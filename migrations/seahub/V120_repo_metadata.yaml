databaseChangeLog:
  - changeSet:
      id: V120_create_repo_metadata
      author: seafile
      changes:
        - createTable:
            ifNotExists: true
            tableName: repo_metadata
            columns:
              - column:
                  name: id
                  type: serial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: repo_id
                  type: varchar(36)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: key_repo_metadata_repo_id
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: face_recognition_enabled
                  type: boolean
              - column:
                  name: last_face_cluster_time
                  type: datetime
              - column:
                  name: modified_time
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: created_time
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: from_commit
                  type: varchar(40)
              - column:
                  name: to_commit
                  type: varchar(40)
  - changeSet:
      id: V120_add_indexes_to_repo_metadata
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
                tableName: repo_metadata
                indexName: key_repo_metadata_enabled
      changes:
        - createIndex:
            tableName: repo_metadata
            indexName: key_repo_metadata_enabled
            columns:
              - column:
                  name: enabled
        - createIndex:
            tableName: repo_metadata
            indexName: key_repo_metadata_face_recognition_enabled
            columns:
              - column:
                  name: face_recognition_enabled

  - changeSet:
      id: V120_create_repo_metadata_view
      author: seafile
      changes:
        - createTable:
            ifNotExists: true
            tableName: repo_metadata_view
            columns:
              - column:
                  name: id
                  type: serial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: repo_id
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: longtext
                  constraints:
                    nullable: false
  - changeSet:
      id: V120_add_index_to_repo_metadata_view
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
                tableName: repo_metadata_view
                indexName: idx_repo_meatadata_view_repo_id
      changes:
        - createIndex:
            tableName: repo_metadata_view
            indexName: idx_repo_meatadata_view_repo_id
            columns:
              - column:
                  name: repo_id
