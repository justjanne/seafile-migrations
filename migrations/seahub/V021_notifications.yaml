databaseChangeLog:
  - changeSet:
      id: V021_drop_notifications_usernotification
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          tableExists:
            tableName: notifications_usernotification
      changes:
        - dropTable:
            tableName: notifications_usernotification
  - changeSet:
