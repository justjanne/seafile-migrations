              - column:
                  name: detail
                  type: longtext
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: seen
                  type: boolean
                  constraints:
                    nullable: false
  - changeSet:
