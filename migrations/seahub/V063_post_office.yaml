            columnExists:
              tableName: post_office_attachment
              columnName: mimetype
      changes:
        - addColumn:
            tableName: post_office_attachment
            columns:
              - column:
                  name: mimetype
                  type: varchar(255)
                  constraints:
                    nullable: false

