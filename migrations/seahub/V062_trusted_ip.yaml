databaseChangeLog:
  - changeSet:
      id: V062_create_trusted_ip_trustedip
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: trusted_ip_trustedip
      changes:
        - createTable:
            tableName: trusted_ip_trustedip
            columns:
              - column:
                  name: id
                  type: serial
