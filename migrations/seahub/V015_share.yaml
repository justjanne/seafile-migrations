databaseChangeLog:
  - changeSet:
      id: V015_create_share_anonymousshare
      author: seafile
      changes:
        - createTable:
            ifNotExists: true
            tableName: share_anonymousshare
            columns:
              - column:
                  name: id
                  type: serial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: repo_owner
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: repo_id
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: anonymous_email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: varchar(25)
                  constraints:
                    nullable: false
  - changeSet:
      id: V015_drop_unique_constraint_to_share_anonymousshare_token
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          indexExists:
            tableName: share_anonymousshare
            indexName: token
      changes:
        - dropUniqueConstraint:
            tableName: share_anonymousshare
            constraintName: token
  - changeSet:
      id: V015_add_unique_constraint_to_share_anonymousshare_token
      author: seafile
      preConditions:
        - onFail: MARK_RAN
