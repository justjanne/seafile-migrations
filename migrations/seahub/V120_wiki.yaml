            columnNames: repo_id
            constraintName: wiki_wiki2_publish_repo_id_key
  - changeSet:
      id: V120_drop_wiki_wiki2_publish_publish_url
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          indexExists:
            tableName: wiki_wiki2_publish
            indexName: publish_url
      changes:
        - dropUniqueConstraint:
            tableName: wiki_wiki2_publish
            constraintName: publish_url
  - changeSet:
      id: V120_add_wiki_wiki2_publish_publish_url_key
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
                tableName: wiki_wiki2_publish
                indexName: wiki_wiki2_publish_publish_url_key
      changes:
        - addUniqueConstraint:
            tableName: wiki_wiki2_publish
            columnNames: publish_url
            constraintName: wiki_wiki2_publish_publish_url_key
  - changeSet:
      id: V120_add_ix_wiki2_publish_repo_id
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
                tableName: wiki_wiki2_publish
                indexName: ix_wiki2_publish_repo_id
      changes:
        - createIndex:
            tableName: wiki_wiki2_publish
            indexName: ix_wiki2_publish_repo_id
            columns:
              - column:
                  name: repo_id
