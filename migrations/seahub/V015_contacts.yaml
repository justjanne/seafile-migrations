      author: seafile
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
                tableName: contacts_contact
                indexName: contacts_contact_d3d8b136
      changes:
        - createIndex:
            tableName: contacts_contact
            indexName: contacts_contact_d3d8b136
