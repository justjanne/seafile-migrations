  # base_filecomment
  - changeSet:
      id: V063_drop_base_filecomment
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          and:
            - tableExists:
                tableName: base_filecomment
            - not:
                columnExists:
                  tableName: base_filecomment
                  columnName: uuid_id
      changes:
        - dropTable:
            tableName: base_filecomment
  - changeSet:
      id: V063_recreate_base_filecomment
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: base_filecomment
      changes:
        - createTable:
            tableName: base_filecomment
            columns:
              - column:
                  name: id
                  type: serial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: author
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: longtext
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: uuid_id
                  type: char(32)
                  constraints:
                    nullable: false
  - changeSet:
      id: V063_recreate_base_filecomment_author
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
                indexName: base_filecomment_author_8a4d7e91
      changes:
        - createIndex:
            tableName: base_filecomment
            indexName: base_filecomment_author_8a4d7e91
            columns:
              - column:
                  name: author
  - changeSet:
      id: V063_recreate_base_filecomment_uuid_id_fl
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          not:
            - foreignKeyConstraintExists:
                foreignKeyName: base_filecomment_uuid_id_4f9a2ca2_fk_tags_fileuuidmap_uuid
      changes:
        - addForeignKeyConstraint:
            baseTableName: base_filecomment
            baseColumnNames: uuid_id
            referencedTableName: tags_fileuuidmap
            referencedColumnNames: uuid
            constraintName: base_filecomment_uuid_id_4f9a2ca2_fk_tags_fileuuidmap_uuid

