databaseChangeLog:
  - changeSet:
      id: V021_create_share_uploadlinkshare
      author: seafile
      changes:
        - createTable:
            ifNotExists: true
            tableName: share_uploadlinkshare
            columns:
              - column:
                  name: id
                  type: serial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: repo_id
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: path
                  type: longtext
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: ctime
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: view_cnt
                  type: int
                  constraints:
                    nullable: false
  - changeSet:
      id: V021_drop_share_uploadlinkshare_token
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          indexExists:
            tableName: share_uploadlinkshare
            indexName: token
      changes:
        - dropUniqueConstraint:
            tableName: share_uploadlinkshare
            constraintName: token
  - changeSet:
      id: V021_drop_share_uploadlinkshare_unq_share_uploadlinkshare_token
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          indexExists:
