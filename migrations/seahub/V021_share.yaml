        - onFail: MARK_RAN
          not:
            - indexExists:
                tableName: share_uploadlinkshare
                indexName: share_uploadlinkshare_2059abe4
      changes:
        - createIndex:
            tableName: share_uploadlinkshare
            indexName: share_uploadlinkshare_2059abe4
            columns:
              - column:
                  name: repo_id
