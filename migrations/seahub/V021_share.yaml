            indexName: unq_share_uploadlinkshare_token
      changes:
        - dropUniqueConstraint:
            tableName: share_uploadlinkshare
            constraintName: unq_share_uploadlinkshare_token
  - changeSet:
      id: V021_add_unique_constraint_to_share_uploadlinkshare_token
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
                tableName: share_uploadlinkshare
                indexName: share_uploadlinkshare_token_key
      changes:
        - addUniqueConstraint:
            tableName: share_uploadlinkshare
            constraintName: share_uploadlinkshare_token_key
            columnNames: token
  - changeSet:
      id: V021_add_index_to_share_uploadlinkshare_username
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
