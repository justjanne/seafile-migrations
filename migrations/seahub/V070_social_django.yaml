databaseChangeLog:
  # social_auth_association
  - changeSet:
      id: V070_create_social_auth_association
      author: seafile
      changes:
        - createTable:
            ifNotExists: true
            tableName: social_auth_association
            columns:
              - column:
                  name: id
                  type: serial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: server_url
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: handle
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: secret
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: issued
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: lifetime
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: assoc_type
                  type: varchar(64)
                  constraints:
                    nullable: false

  - changeSet:
      id: V070_create_social_auth_association_unique_constraint
      author: seafile
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
                tableName: social_auth_association
                indexName: social_auth_association_server_url_handle_078befa2_uniq
      changes:
        - addUniqueConstraint:
            tableName: social_auth_association
            columnNames: server_url, handle
            constraintName: social_auth_association_server_url_handle_078befa2_uniq

